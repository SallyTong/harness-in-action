# CI Pipeline — AI Homework Grader
#
# Runs on every push to master and every pull request.
# Ensures lint, tests, and Docker builds pass before merge.
#
# Jobs:
#   1. lint-backend   — ruff check + format
#   2. lint-frontend  — tsc type check
#   3. test-backend   — pytest with MySQL 8.4 service
#   4. test-frontend  — vitest
#   5. build-docker   — Docker image build (blocks on all above)

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-progress runs for the same PR to save runner minutes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════
  # Backend Lint
  # ═══════════════════════════════════════════════════════
  lint-backend:
    name: Lint Backend (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        run: |
          cd apps/backend
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: |
          cd apps/backend
          ruff check .
          ruff format --check .

  # ═══════════════════════════════════════════════════════
  # Frontend Lint
  # ═══════════════════════════════════════════════════════
  lint-frontend:
    name: Lint Frontend (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/frontend
          npm ci

      - name: Type check
        run: |
          cd apps/frontend
          npx tsc --noEmit

  # ═══════════════════════════════════════════════════════
  # Backend Tests
  # ═══════════════════════════════════════════════════════
  test-backend:
    name: Test Backend (pytest)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: homework_grader_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: mysql+aiomysql://root:test@localhost:3306/homework_grader_test
      GLM_API_KEY: ci-dummy-key
      GLM_MODEL: glm-4v-flash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        run: |
          cd apps/backend
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd apps/backend
          python -m pytest tests/ -v --tb=short

  # ═══════════════════════════════════════════════════════
  # Frontend Tests
  # ═══════════════════════════════════════════════════════
  test-frontend:
    name: Test Frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/frontend
          npm ci

      - name: Run tests
        run: |
          cd apps/frontend
          npm run test

  # ═══════════════════════════════════════════════════════
  # Docker Build
  # ═══════════════════════════════════════════════════════
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t homework-grader-backend:ci ./apps/backend

      - name: Build frontend image
        run: docker build -t homework-grader-frontend:ci ./apps/frontend
